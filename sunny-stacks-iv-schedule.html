<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Stacks IV MTT Series &mdash; Vegas Infinite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Brand font is Capitana (Darden Studio, licensed). Mulish loaded as the closest free
     geometric-humanist fallback so the page renders for anyone without the licensed webfont. -->
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Vegas Infinite brand palette, tuned for a daylight beach setting */
  --magenta:#d6007a;
  --orange:#ef5f0a;
  --cyan:#0e93a6;
  --sea:#1e9cb8;
  --sea-lit:#37c0d6;
  --sky-hi:#a9e5f8;
  --sky-lo:#5cc0e6;
  --sand-hi:#f2dcae;
  --sand-lo:#cfa365;
  --gold-1:#f2a81c;
  --marq-1:#2f6fe0;
  --marq-2:#1a4fb8;
  --grad-logo-deep:linear-gradient(180deg,#eda916 0%,#f2860a 48%,#e3620a 82%,#d24a06 100%);
  --grad-logo-h:linear-gradient(90deg,#fee47b,#fcc64a 38%,#fb9b0b 74%,#ff6703);
  --grad-marq:linear-gradient(90deg,#6ea8ff,#3b7bf0 45%,#1a4fb8);
  /* moodboard sweep for the hero call-outs: gold to orange to magenta, the
     same warm-to-hot family Kickoff used for its date range and tagline,
     kept at the same deeper saturation as --magenta/--cyan above so it
     still reads against a bright sky. */
  --grad-hero:linear-gradient(100deg,#fbc23a 0%,#f9a417 36%,#f2740b 72%,#e04a12 100%);
  --grad-hero-cool:linear-gradient(100deg,#4ec6dd 0%,#22a6c0 40%,#118da6 74%,#0c6e85 100%);
  /* section headings: navy out to turquoise, the cool counterpoint to the
     warm logo gradient */
  --grad-section:linear-gradient(96deg,#0b3243 0%,#0e6379 38%,#12869e 70%,#17a0b8 100%);
  --ink:#0d3345;        /* deep sea navy — primary text */
  --ink-2:#3d6577;      /* secondary text */
  --panel:rgba(255,253,246,.86);
  --panel-bd:rgba(13,51,69,.14);
  --shadow:0 2px 0 rgba(13,51,69,.05), 0 14px 30px -18px rgba(13,51,69,.55);
  --head: 'Capitana','Mulish',system-ui,sans-serif;
  --body: 'Capitana','Mulish',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  position:relative;
  font-family:var(--body);
  font-weight:400;
  color:var(--ink);
  background:#69bcea;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  line-height:1.5;
}
::selection{background:var(--orange);color:#fff}

/* ===== the beach, redrawn as flat colour =====
   a photo put the busiest, brightest pixels (glare, cloud, sand grain) exactly
   where the schedule sits, which is what made it hard to read. a flat gradient
   has a fully known, monotonic luminance profile, so every text style below is
   verified against it rather than assumed. sky sits at the top; sand takes over
   by the time real content (stats, schedule) begins, and continues as a solid
   colour for however long the page turns out to be. nothing here moves. */
.bg{position:absolute;inset:0;z-index:-2;overflow:hidden;background-color:var(--sand-lo)}
.bg-sky{position:absolute;top:0;left:0;width:100%;
  height:clamp(940px,80vw,1340px);
  background:
    /* broad warm bloom along the top edge. this is atmosphere, not the sun --
       the sun itself is a hard circle on .hero::before. */
    radial-gradient(140% 34% at 50% 0%, rgba(255,230,155,.30), transparent 72%),
    linear-gradient(180deg,
      #0e94d6 0%,
      var(--sky-lo) 20%,
      var(--sky-hi) 44%,
      /* shallow water before the shoreline: the blues now hold most of the
         frame and the sand is the last third rather than half of it */
      #d5eff6 57%,
      #fbf1da 71%,
      var(--sand-hi) 87%,
      var(--sand-lo) 100%)}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(9,38,52,.94),rgba(9,38,52,.80));
  border-bottom:1px solid rgba(255,255,255,.14);
}
.topbar .wrap{display:flex;align-items:center;justify-content:center;height:62px}
.vi-mark{display:block;height:24px;width:auto;
  filter:drop-shadow(0 1px 6px rgba(246,197,68,.25))}
.topbar .vi-mark{height:26px}
footer .vi-mark{height:30px;margin:0 auto 14px}

/* ============ HERO ============ */
.hero{position:relative;text-align:center;padding:0 0 52px;overflow:hidden}
.hero::before{ /* a low sun sitting behind the logo lockup.
  it was sized in percentages of the hero box, so a wide window stretched it
  into an ellipse. aspect-ratio locks the box square and the circle keyword
  locks the gradient round, so it stays a sun at every width. */
  content:"";position:absolute;top:-4%;right:7%;pointer-events:none;
  width:clamp(360px,32vw,680px);aspect-ratio:1;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,250,214,.92) 0%,
    rgba(255,238,164,.62) 34%,
    rgba(255,228,140,.26) 56%,
    transparent 74%);
}
.hero .wrap{position:relative;z-index:2;padding-top:clamp(64px,8.5vw,124px)}
/* the real palm fronds, framing the hero. two separate cut-outs, each pinned to
   a VIEWPORT edge (left:0 / right:0) rather than one centred composite. the
   composite was capped at a max-width and centred, so on any monitor wider than
   that cap the fronds drifted inward and left bare sky in the corners. pinned to
   the edges they hug the sides of the screen at every width. static -- nothing
   here moves. */
.palm-scene{position:absolute;top:0;left:0;right:0;height:0;z-index:1;pointer-events:none}
.palm-scene img{position:absolute;top:0;display:block;height:auto;
  width:clamp(260px,30vw,540px);
  filter:drop-shadow(0 12px 18px rgba(6,44,60,.13));
  /* fronds dissolve before they reach the schedule so no stray leaf tip lands
     behind the section heading or the first rows */
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 60%,rgba(0,0,0,.4) 86%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 0%,#000 60%,rgba(0,0,0,.4) 86%,transparent 100%)}
.palm-l{left:0}
.palm-r{right:0}
/* narrow screens: the fronds still have to touch both edges, but at phone width
   two full cut-outs would meet in the middle and sit right on top of the logo.
   so they shrink, slide a little further off-frame, and fade out higher up. */
@media(max-width:900px){
  .palm-scene img{width:54vw}
  .palm-l{left:-5vw}
  .palm-r{right:-5vw}
}
@media(max-width:560px){
  .palm-scene img{width:50vw;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.32) 72%,transparent 96%);
            mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.32) 72%,transparent 96%)}
  .palm-l{left:-8vw}
  .palm-r{right:-8vw}
}
.kickoff-badge{display:inline-flex;align-items:center;gap:.6em;
  font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.26em;
  font-size:11px;color:var(--ink);
  padding:8px 18px;border-radius:999px;margin-bottom:22px;
  background:rgba(255,253,246,.82);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 18px -10px rgba(13,51,69,.6)}
.kickoff-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--sea);
  box-shadow:0 0 10px rgba(30,156,184,.9)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* soft atmospheric scrim behind the whole hero lockup so the white type and the
   logo separate from the bright sky instead of dissolving into it */
.hero .wrap::before{
  content:"";position:absolute;z-index:-1;pointer-events:none;
  left:50%;top:clamp(46px,6.5vw,96px);transform:translateX(-50%);
  width:min(1120px,116%);height:min(620px,80vw);
  /* a soft, low-alpha vignette for ambient depth only -- legibility for the
     hero text comes from the outline on the glyphs themselves (below), not
     from darkening the sky. a stronger scrim here read as a dark storm
     cloud sitting over the hero, which fights the brief's "bright, sunny"
     direction more than a photo's local variance ever did. */
  background:
    radial-gradient(58% 46% at 50% 36%, rgba(5,30,44,.30) 0%, rgba(5,30,44,.16) 50%,
                    rgba(5,30,44,0) 78%);
  filter:blur(12px);
  filter:blur(10px);
}
.series-logo{
  position:relative;
  display:block;width:min(860px,94%);height:auto;margin:2px auto 0;
  /* tight dark edge for definition, then depth, then a warm halo that lifts the gold */
  /* the updated artwork ships with its own shadow baked in, so this is ambient
     depth only. stacking hard dark edge passes on top of a shadow that already
     exists just closes up the letterforms. */
  filter:
    drop-shadow(0 10px 20px rgba(4,26,38,.28))
    drop-shadow(0 0 46px rgba(255,190,60,.26));
}
/* ---- gradient type, done properly ----------------------------------------
   text-shadow paints in the INLINE CONTENT layer, which sits on top of the
   element's own background. on background-clip:text type the gradient lives in
   that background layer, so a stacked dark text-shadow outline covers it
   completely and the words render flat black. that is what happened here.
   drop-shadow() is a filter: it works off the rendered alpha of the element, so
   the outline sits behind the glyph and the gradient survives intact. every
   gradient headline below uses filter, never text-shadow. */
.hero .dates{margin:22px auto 6px;font-family:var(--head);font-weight:900;
  text-transform:uppercase;letter-spacing:.1em;font-size:clamp(24px,4.4vw,44px);
  margin-bottom:0;
  background:var(--grad-hero);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
/* the gradient sits on the LINE, not on each word, so it is one unbroken sweep
   from the A of AUG 13 through to the 3 of AUG 23. painting it per span made it
   restart mid-line, which is what read as a rainbow rather than a gradient. */
.hero .tag{font-family:var(--head);font-weight:800;text-transform:uppercase;
  letter-spacing:.16em;font-size:clamp(12px,1.9vw,16px);margin-top:20px;
  color:#fff;-webkit-text-fill-color:#fff}
/* the highlight rides the span, not the div, so a wrapped line gets its own
   marker on each row instead of one rectangle spanning both. box-decoration-break
   is what makes the padding and the corners repeat per line. */
.hero .tag span{display:inline;
  background:linear-gradient(100deg,#f97316 0%,#ef5f0a 55%,#e04a12 100%);
  padding:.42em .72em;border-radius:6px;line-height:2.25;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  box-shadow:0 6px 16px -8px rgba(148,52,4,.75)}
.scorebig{font-family:var(--head);font-weight:900;text-transform:uppercase;
  letter-spacing:.03em;font-size:clamp(22px,4.4vw,38px);margin-top:22px}
.scorebig .l{background:var(--grad-hero);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.scorebig .r{background:var(--grad-hero-cool);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}


/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 8px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid rgba(255,255,255,.85);border-radius:16px;
  padding:20px 16px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stat::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;
  background:var(--grad-logo-h)}
.stat .num{font-family:var(--head);font-weight:900;font-size:clamp(28px,5vw,42px);
  background:var(--grad-logo-deep);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.stat .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.16em;
  font-weight:800;margin-top:9px;color:var(--ink-2)}

/* ============ SECTION HEAD ============ */
.section{padding:54px 0}
.section-head{text-align:center;margin-bottom:26px}
/* ocean sweep: deep sea navy running out to turquoise, the cool counterweight
   to all the orange in the stats, tabs and buy-ins. same filter technique as the
   hero -- a white halo for lift off the sand, never a text-shadow. */
.section-head h2{font-family:var(--head);font-weight:900;text-transform:uppercase;
  letter-spacing:.03em;font-size:clamp(26px,5vw,48px);
  background:var(--grad-section);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:
    drop-shadow(0 0 1.5px rgba(255,255,255,.95))
    drop-shadow(0 1px 0 rgba(255,255,255,.9))
    drop-shadow(0 0 18px rgba(255,255,255,.5))
    drop-shadow(0 8px 16px rgba(6,32,46,.25))}

/* ============ CONTROLS ============ */
/* THIS was the dark rectangle. the sticky bar carried a near-black veil to mute
   schedule rows scrolling under it, and because the bar is full-bleed and always
   parked on screen, that veil read as a dark gradient block smeared across the
   sand at every scroll position. the veil is now sand-lo, the exact flat colour
   the page settles on behind the bar, so it is invisible against the background
   and still mutes anything passing underneath. */
.controls{position:sticky;top:62px;z-index:40;padding:18px 0 22px;
  background:linear-gradient(180deg,
    rgba(207,163,101,0) 0%,
    rgba(207,163,101,.72) 18%,
    rgba(207,163,101,.9) 50%,
    rgba(207,163,101,.66) 82%,
    rgba(207,163,101,0) 100%)}
.weeks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.week-tab{font-family:var(--head);font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;font-size:12.5px;color:var(--ink);
  padding:11px 18px;border-radius:12px;cursor:pointer;border:1px solid var(--panel-bd);
  background:#fff;transition:.18s;white-space:nowrap;
  box-shadow:0 3px 12px -5px rgba(6,32,46,.55), 0 1px 0 rgba(13,51,69,.08)}
.week-tab .sub{display:block;font-size:10px;color:var(--ink-2);letter-spacing:.12em;margin-top:2px}
.week-tab:hover{border-color:var(--sea);transform:translateY(-1px)}
.week-tab.active{color:#5c3402;border-color:transparent;
  background:var(--grad-logo-h);
  box-shadow:0 8px 18px -10px rgba(13,51,69,.7)}
.week-tab.active .sub{color:#7a4a06}
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:14px}
.chip{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
  padding:8px 14px;border-radius:999px;cursor:pointer;border:1px solid var(--panel-bd);
  background:#fff;color:var(--ink-2);transition:.16s;
  box-shadow:0 3px 10px -5px rgba(6,32,46,.5), 0 1px 0 rgba(13,51,69,.06)}
.chip:hover{color:var(--ink);transform:translateY(-1px)}
.chip.on{color:#fff;border-color:transparent}
.chip.on[data-speed="all"]{background:var(--ink);color:#fffdf6}
.chip.on[data-speed="Regular"]{background:var(--magenta)}
.chip.on[data-speed="Turbo"]{background:var(--orange)}
.chip.on[data-speed="Hyper"]{background:var(--cyan)}
.chip.on[data-speed="featured"]{background:var(--grad-marq);color:#fff}
.chip.on[data-speed="freeroll"]{background:linear-gradient(120deg,var(--sea),var(--sea-lit))}
.search{flex:0 0 auto}
.search input{font-family:var(--body);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--panel-bd);border-radius:999px;
  padding:9px 16px;width:190px;outline:none;transition:.16s;
  box-shadow:0 3px 10px -5px rgba(6,32,46,.5)}
.search input:focus{border-color:var(--sea);width:220px}
.search input::placeholder{color:#93a9b3}

/* ============ DAY GROUPS ============ */
.day{margin-bottom:34px}
.day-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;
  padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.55);flex-wrap:wrap}
.day-head .wd{font-family:var(--head);font-weight:900;text-transform:uppercase;
  letter-spacing:.05em;font-size:26px;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.8), 0 0 16px rgba(255,255,255,.5)}
.day-head .dt{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;
  color:#08404f;background:rgba(255,255,255,.78);padding:3px 10px;border-radius:999px}
.day-head .tag{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.12em;padding:5px 12px;border-radius:999px;
  background:rgba(255,253,246,.9);color:#8a5809;border:1px solid rgba(217,155,18,.5)}
.day-head .tag.x2{color:#0d5f72;border-color:rgba(30,156,184,.55)}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0 7px;table-layout:fixed}
.tbl col.c-ev{width:39%}
.tbl col.c-tm{width:15%}
.tbl col.c-sp{width:13%}
.tbl col.c-st{width:15%}
.tbl col.c-bi{width:18%}
.tbl thead th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;
  color:#0a3e4e;text-align:left;padding:0 14px 6px;
  text-shadow:0 1px 0 rgba(255,255,255,.9), 0 0 9px rgba(255,255,255,.65)}
.tbl thead th.r{text-align:right}
.row{background:var(--panel);border-radius:12px;transition:.16s;cursor:default}
.row td{padding:13px 14px;border-top:1px solid rgba(255,255,255,.8);
  border-bottom:1px solid rgba(13,51,69,.10);
  vertical-align:middle;font-size:13.5px}
.row td:first-child{border-left:1px solid rgba(255,255,255,.8);border-radius:12px 0 0 12px}
.row td:last-child{border-right:1px solid rgba(13,51,69,.10);border-radius:0 12px 12px 0;text-align:right}
.row:hover{background:#fffefa}
.row .nm{font-weight:700;color:var(--ink)}
.row td.nm{white-space:normal;overflow-wrap:anywhere}
.row .nm .sep{color:var(--ink-2);opacity:.5;margin:0 .35em}
.row .tm{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);font-weight:700}
.row .chips{color:var(--ink-2);font-size:12px;white-space:nowrap}
.buyin{font-family:var(--head);font-weight:900;font-variant-numeric:tabular-nums;
  background:var(--grad-logo-deep);
  -webkit-background-clip:text;background-clip:text;color:transparent;font-size:15.5px;white-space:nowrap}
.buyin.free{background:linear-gradient(180deg,var(--sea-lit),var(--sea) 45%,#0c5d70);
  -webkit-background-clip:text;background-clip:text}
.sp{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;padding:4px 10px;border-radius:999px;color:#fff}
.sp.Hyper{background:#fde047;color:#5c4a00}
.sp.Turbo{background:var(--orange)}
.sp.Regular{background:var(--magenta)}

/* featured rows
   the tint lives on the <tr>, not on each <td>. painting it per cell made the
   gradient restart at every column edge, which is what caused the visible seams.
   one paint per row means one continuous sweep straight across. */
.row.feat{background:rgba(59,123,240,.92)}
.row.feat td{background:none;
  border-top-color:rgba(255,255,255,.9);border-bottom-color:rgba(26,79,184,.45)}
.row.feat td:first-child{box-shadow:inset 4px 0 0 var(--marq-1)}
.row.feat:hover{background:rgba(26,79,184,.95)}
.row.feat:hover td{background:none}
.row.feat .nm{color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.row.feat .nm .sep{color:#fff;opacity:.7}
.row.freeroll .nm .sep{color:#fff;opacity:.7}
.row.freeroll{background:rgba(30,156,184,.88)}
.row.freeroll td{background:none;border-bottom-color:rgba(30,156,184,.45)}
.row.freeroll td:first-child{box-shadow:inset 4px 0 0 var(--sea)}
.row.freeroll:hover{background:rgba(20,120,142,.95)}
.row.freeroll:hover td{background:none}
.row.freeroll .nm{color:#fff;font-weight:800}
.row.feat .chips, .row.freeroll .chips{color:#fff}
.row.feat .tm, .row.freeroll .tm{color:#fff}
.row.feat .buyin, .row.freeroll .buyin{background:none;-webkit-background-clip:initial;
  background-clip:initial;color:#fff}

.noresult{text-align:center;padding:44px;font-size:14px;color:var(--ink);
  background:rgba(255,253,246,.8);border-radius:16px}

/* mobile cards */
@media(max-width:640px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl{border-spacing:0}
  .row{margin-bottom:10px;border-radius:14px;border:1px solid rgba(255,255,255,.85);
    overflow:hidden;box-shadow:var(--shadow)}
  .row td{border:none!important;border-radius:0!important;padding:5px 14px;text-align:left!important;
    display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:none!important}
  .row td:first-child{padding-top:13px}
  .row td:last-child{padding-bottom:13px}
  .row td::before{content:attr(data-l);font-size:10px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--ink-2);font-weight:800}
  .row td.nm .nmw{text-align:right}
  .row.feat td, .row.freeroll td{background:none!important}
  .row.feat{background:rgba(59,123,240,.9);
    border-color:rgba(26,79,184,.5)}
  .row.freeroll{background:rgba(30,156,184,.86);
    border-color:rgba(30,156,184,.5)}
  .day-head .tag{margin-left:0}
}
/* stop the stat line breaking a single word onto its own row on phones */
@media(max-width:560px){
  .hero .tag{letter-spacing:.09em;font-size:11.5px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:8px}

/* ============ FOOTER ============ */
footer{padding:38px 0 44px;margin-top:26px;text-align:center;

"name":"Event 85 \u00b7 Thursday Thaw","t":"10:00 PM","b":100000,"s":"Hyper","c":1500},{"n":86,"name":"Event 86 \u00b7 Thursday Tranquility","t":"12:00 AM","b":1000000,"s":"Turbo","c":2500}]},{"weekday":"Friday","date":"Aug 21","tag":"Finale Weekend (\u00d72)","events":[{"n":87,"name":"Event 87","t":"9:00 AM","b":200000,"s":"Turbo","c":1500},{"n":88,"name":"Event 88","t":"11:00 AM","b":100000,"s":"Turbo","c":1500},{"n":89,"name":"Event 89","t":"12:00 PM","b":25000,"s":"Turbo","c":1000},{"n":90,"name":"Event 90","t":"1:00 PM","b":200000,"s":"Turbo","c":1500},{"n":91,"name":"Event 91","t":"2:00 PM","b":75000,"s":"Turbo","c":1000},{"n":92,"name":"Event 92","t":"3:00 PM","b":1000000,"s":"Turbo","c":2500},{"n":93,"name":"Event 93 \u00b7 Sizzlin' 6-Max","t":"4:00 PM","b":100000,"s":"Turbo","c":1000},{"n":94,"name":"Event 94","t":"5:00 PM","b":300000,"s":"Turbo","c":1500},{"n":95,"name":"Event 95","t":"6:00 PM","b":10000,"s":"Hyper","c":500},{"n":96,"name":"Event 96 \u00b7 Mini Main Event","t":"7:00 PM","b":1000000,"s":"Regular","c":3500},{"n":97,"name":"Event 97","t":"8:00 PM","b":250000,"s":"Turbo","c":1500},{"n":98,"name":"Event 98","t":"8:30 PM","b":500000,"s":"Turbo","c":2000},{"n":99,"name":"Event 99","t":"9:00 PM","b":75000,"s":"Turbo","c":1000},{"n":100,"name":"Event 100","t":"10:00 PM","b":6000000,"s":"Turbo","c":3000},{"n":101,"name":"Event 101","t":"11:00 PM","b":500000,"s":"Turbo","c":1500},{"n":102,"name":"Event 102","t":"12:00 AM","b":1000000,"s":"Turbo","c":2000}]},{"weekday":"Saturday","date":"Aug 22","tag":"Finale Weekend (\u00d72)","events":[{"n":103,"name":"Event 103","t":"9:00 AM","b":100000,"s":"Turbo","c":1500},{"n":104,"name":"Event 104 \u00b7 Main Event Satellite","t":"11:00 AM","b":500000,"s":"Turbo","c":1500},{"n":105,"name":"Event 105","t":"12:00 PM","b":30000,"s":"Hyper","c":1000},{"n":106,"name":"Event 106","t":"1:00 PM","b":100000,"s":"Turbo","c":1000},{"n":107,"name":"Event 107","t":"2:00 PM","b":10000,"s":"Hyper","c":500},{"n":108,"name":"Event 108","t":"3:00 PM","b":200000,"s":"Turbo","c":1500},{"n":109,"name":"Event 109","t":"4:00 PM","b":75000,"s":"Turbo","c":1000},{"n":110,"name":"Event 110 \u00b7 Main Event","t":"5:00 PM","b":5000000,"s":"Regular","c":5000},{"n":111,"name":"Event 111","t":"6:00 PM","b":25000,"s":"Hyper","c":1000},{"n":112,"name":"Event 112","t":"7:00 PM","b":400000,"s":"Turbo","c":1500},{"n":113,"name":"Event 113","t":"8:00 PM","b":2500000,"s":"Turbo","c":2000},{"n":114,"name":"Event 114 \u00b7 Sink or Swim","t":"8:30 PM","b":50000,"s":"Hyper","c":100},{"n":115,"name":"Event 115 \u00b7 100M Freeroll!","t":"9:00 PM","b":"FREEROLL","s":"Hyper","c":1000},{"n":116,"name":"Event 116","t":"10:00 PM","b":100000,"s":"Turbo","c":1000},{"n":117,"name":"Event 117","t":"11:00 PM","b":250000,"s":"Turbo","c":1500},{"n":118,"name":"Event 118 \u00b7 Sandbar Super Roller Satellite","t":"12:00 AM","b":10000000,"s":"Turbo","c":1500}]},{"weekday":"Sunday","date":"Aug 23","tag":"Finale Weekend (\u00d72)","events":[{"n":119,"name":"Event 119","t":"9:00 AM","b":50000,"s":"Turbo","c":1000},{"n":120,"name":"Event 120","t":"11:00 AM","b":200000,"s":"Turbo","c":1500},{"n":121,"name":"Event 121 \u00b7 Sandbar Super Roller Satellite","t":"1:00 PM","b":10000000,"s":"Turbo","c":1500},{"n":122,"name":"Event 122","t":"2:00 PM","b":1000000,"s":"Turbo","c":2000},{"n":123,"name":"Event 123","t":"3:00 PM","b":400000,"s":"Turbo","c":1500},{"n":124,"name":"Event 124 \u00b7 50M Freeroll!","t":"4:00 PM","b":"FREEROLL","s":"Hyper","c":1000},{"n":125,"name":"Event 125","t":"5:00 PM","b":200000,"s":"Turbo","c":1500},{"n":126,"name":"Event 126 \u00b7 Sandbar Super Roller","t":"6:00 PM","b":100000000,"s":"Regular","c":7000},{"n":127,"name":"Event 127","t":"7:00 PM","b":250000,"s":"Turbo","c":1000},{"n":128,"name":"Event 128","t":"8:00 PM","b":5000000,"s":"Turbo","c":1500},{"n":129,"name":"Event 129","t":"8:30 PM","b":50000,"s":"Turbo","c":1000},{"n":130,"name":"Event 130 \u00b7 Sandy 6-Max","t":"9:00 PM","b":500000,"s":"Turbo","c":1500},{"n":131,"name":"Event 131","t":"10:00 PM","b":100000,"s":"Turbo","c":1000},{"n":132,"name":"Event 132","t":"11:00 PM","b":1000000,"s":"Hyper","c":2500}]}],"rest":[]}];

/* ---------- helpers ---------- */
function fmtBuyin(n){
  if(n === 'FREEROLL') return 'FREE';
  if(n>=1000000){ var m=n/1000000; return (m%1===0?m:m.toFixed(1))+'M'; }
  if(n>=1000){ return (n/1000)+'K'; }
  return ''+n;
}
function fmtChips(n){ return n>=1000? (n/1000)+'K' : ''+n; }

/* ---------- local time ----------
   the source times are ET wall clock. Aug 13-23 2026 sits entirely inside EDT,
   so the offset against UTC is a constant -4 for the whole series. */
var SERIES_YEAR = 2026;
var ET_OFFSET_H = 4;
var MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

var HAS_INTL = (function(){
  try{
    return typeof Intl !== 'undefined' && !!Intl.DateTimeFormat &&
           !!Intl.DateTimeFormat.prototype.formatToParts;
  }catch(e){ return false; }
})();
var fmtTimeLocal = HAS_INTL ? new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}) : null;
var fmtDayLocal  = HAS_INTL ? new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}) : null;

/* the viewer's own zone abbreviation, sampled mid-series so DST resolves correctly */
var TZ_LABEL = (function(){
  if(!HAS_INTL) return 'ET';
  try{
    var parts = new Intl.DateTimeFormat(undefined,{timeZoneName:'short'})
                  .formatToParts(new Date(Date.UTC(SERIES_YEAR,7,18,16,0)));
    for(var i=0;i<parts.length;i++){
      if(parts[i].type === 'timeZoneName' && parts[i].value) return parts[i].value;
    }
  }catch(e){}
  return 'Local';
})();

/* a session date ("Aug 13") plus an ET clock time ("9:00 PM") into a real instant.
   the day's listings open at 9:00 AM, so any small-hours start belongs to the next
   calendar day, which is what the old after-midnight star was flagging. */
function etInstant(dateStr, timeStr){
  var dp  = String(dateStr).trim().split(/\s+/);
  var mon = MONTHS[dp[0]];
  var day = parseInt(dp[1],10);
  var m   = String(timeStr).trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp])/);
  if(mon === undefined || isNaN(day) || !m) return null;
  var h   = parseInt(m[1],10) % 12;
  var min = parseInt(m[2],10);
  if(/[Pp]/.test(m[3])) h += 12;
  if(h < 5) day += 1;
  return new Date(Date.UTC(SERIES_YEAR, mon, day, h + ET_OFFSET_H, min));
}

/* whole-day gap between the viewer's local calendar date and the session date */
function dayShift(inst, dateStr){
  var dp = String(dateStr).trim().split(/\s+/);
  var a  = Date.UTC(inst.getFullYear(), inst.getMonth(), inst.getDate());
  var b  = Date.UTC(SERIES_YEAR, MONTHS[dp[0]], parseInt(dp[1],10));
  return Math.round((a - b) / 86400000);
}

/* resolved once per event, then cached on the event object */
function ltOf(dateStr, e){
  if(e._lt) return e._lt;
  var inst = etInstant(dateStr, e.t);
  e._lt = (!inst || !fmtTimeLocal)
    ? { time:e.t, shift:0, day:'', et:e.t }
    : { time:fmtTimeLocal.format(inst), shift:dayShift(inst,dateStr),
        day:fmtDayLocal.format(inst), et:e.t };
  return e._lt;
}

/* marquee mains and freerolls, keyed by event number */
var FEAT = {
  126:{tier:'SUPER ROLLER',grand:true},
  110:{tier:'MAIN EVENT'},
  33:{tier:'MAIN EVENT'},
  96:{tier:'MINI MAIN'},
  19:{tier:'MINI MAIN'},
  52:{tier:'HIGH ROLLER'},
  39:{tier:'100M GTD',free:true},
  46:{tier:'50M GTD',free:true},
  115:{tier:'100M GTD',free:true},
  124:{tier:'50M GTD',free:true}
};
function featOf(e){ return FEAT[e.n] || null; }

/* ---------- state ---------- */
var state = { week:0, speed:'all', q:'' };

/* ---------- build week tabs ---------- */
var weeksEl = document.getElementById('weeks');
SCHEDULE.forEach(function(w,i){
  var b=document.createElement('button');
  b.className='week-tab'+(i===0?' active':'');
  b.innerHTML = w.label + (w.sub ? '<span class="sub">' + w.sub + '</span>' : '');
  b.onclick=function(){ state.week=i; document.querySelectorAll('.week-tab').forEach(function(t){t.classList.remove('active')}); b.classList.add('active'); render(); };
  weeksEl.appendChild(b);
});

/* ---------- filters ---------- */
document.querySelectorAll('.chip').forEach(function(c){
  function pick(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});
    c.classList.add('on'); state.speed=c.dataset.speed; render();
  }
  c.onclick=pick;
  c.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); pick(); } };
});
document.getElementById('search').addEventListener('input',function(e){ state.q=e.target.value.toLowerCase().trim(); render(); });

/* ---------- render ---------- */
function matchEvent(e, dateStr){
  var f = featOf(e);
  if(state.speed==='featured' && !(f && !f.free)) return false;
  if(state.speed==='freeroll' && !(f && f.free)) return false;
  if(state.speed!=='all' && state.speed!=='featured' && state.speed!=='freeroll' && e.s!==state.speed) return false;
  if(state.q){
    var lt = ltOf(dateStr, e);
    var hay=(e.name+' '+lt.time+' '+e.t+' '+e.s+' '+e.n+' '+fmtBuyin(e.b)).toLowerCase();
    if(hay.indexOf(state.q)===-1) return false;
  }
  return true;
}

function nameHTML(n){
  var i = n.indexOf(' \u00b7 ');
  if(i === -1) return n;
  return n.slice(0,i) + '<span class="sep">&middot;</span>' + n.slice(i+3);
}

function render(){
  var w = SCHEDULE[state.week];
  var out = '';
  var anyShown=false;

  w.days.forEach(function(d){
    var evs = d.events.filter(function(e){ return matchEvent(e, d.date); });
    if(evs.length===0) return;
    anyShown=true;
    var x2 = /\u00d72/.test(d.tag) || /x2/i.test(d.tag);
    out += '<div class="day">';
    out += '<div class="day-head"><span class="wd">'+d.weekday+'</span><span class="dt">'+d.date+'</span>';
    if(d.tag) out += '<span class="tag'+(x2?' x2':'')+'">'+d.tag+'</span>';
    out += '</div>';
    out += '<table class="tbl"><colgroup><col class="c-ev"><col class="c-tm"><col class="c-sp"><col class="c-st"><col class="c-bi"></colgroup><thead><tr><th>Event</th><th>Start</th><th>Speed</th><th>Starting Chips</th><th class="r">Buy-in</th></tr></thead><tbody>';
    evs.forEach(function(e){
      var f = featOf(e);
      var cls = f ? (f.free ? ' freeroll' : ' feat') : '';
      var lt = ltOf(d.date, e);
      out += '<tr class="row'+cls+'">';
      out += '<td class="nm" data-l="Event"><span class="nmw">'+nameHTML(e.name)+'</span></td>';
      out += '<td class="tm" data-l="Start" title="'+lt.et+' ET">'+lt.time+'</td>';
      out += '<td data-l="Speed"><span class="sp '+e.s+'">'+e.s+'</span></td>';
      out += '<td class="chips" data-l="Starting Chips">'+fmtChips(e.c)+'</td>';
      out += '<td data-l="Buy-in"><span class="buyin'+(e.b==='FREEROLL'?' free':'')+'">'+fmtBuyin(e.b)+'</span></td>';
      out += '</tr>';
    });
    out += '</tbody></table></div>';
  });

  if(!anyShown) out = '<div class="noresult">No events match your filters in '+w.label+'. Try another week or clear the search.</div>';
  document.getElementById('schedule-body').innerHTML = out;
}
render();
</script>
